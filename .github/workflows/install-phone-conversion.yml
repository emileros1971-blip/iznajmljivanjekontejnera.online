name: Install phone conversion

on:
  push:
    paths:
      - ".github/workflows/install-phone-conversion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install website phone-click conversion
        run: python .github/scripts/add_phone_conversion.py

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No website changes required."
          else
            git commit -m "Track website phone clicks as Google Ads conversions"
            git push
          fi
