name: Install Google Ads tag

on:
  push:
    paths:
      - '.github/workflows/install-google-ads-tag.yml'

permissions:
  contents: write

jobs:
  install-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google Ads tag and form conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          ga_line = "  gtag('config', 'G-EQY4E0QHY1');"
          ads_line = "  gtag('config', 'AW-18320037201');"
          if ads_line not in html:
              html = html.replace(ga_line, ga_line + "\n" + ads_line, 1)

          marker = "      window.dataLayer.push({event:'contact_form_submit',form_name:'Iznajmljivanje kontejnera Novi Sad'});"
          conversion = "      gtag('event', 'conversion', {'send_to': 'AW-18320037201/a6M4CPLkp9EcENGq1p9E'});"
          if conversion not in html:
              html = html.replace(marker, marker + "\n" + conversion, 1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Install Google Ads tag and lead conversion"
            git push
          fi
