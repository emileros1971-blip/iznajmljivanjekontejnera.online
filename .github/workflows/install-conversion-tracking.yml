name: Install conversion tracking

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/install_conversion_tracking.py
      - .github/workflows/install-conversion-tracking.yml

permissions:
  contents: write

jobs:
  install-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install and verify tracking
        run: python scripts/install_conversion_tracking.py

      - name: Commit tracking changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Track successful leads and phone clicks"
            git push
          fi
